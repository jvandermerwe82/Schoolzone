name: CI

on:
  pull_request:
  push:
    branches:
      - claude/adaptive-school-app-skills-i93pd7
      - main
      - 'arch/**'
      - 'feat/**'
      - 'fix/**'
      - 'lab/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Brain Lab benchmark
        run: npm run --silent brain:lab > brain-lab.json

      - name: Upload Brain Lab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-lab-${{ github.sha }}
          path: brain-lab.json
          retention-days: 30

      - name: Production build
        run: npm run build
