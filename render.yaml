services:
  - type: web
    name: schoolzone
    runtime: node
    branch: claude/adaptive-school-app-skills-i93pd7
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: mkdir -p data/backups && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit

    disk:
      name: schoolzone-data
      mountPath: /opt/render/project/src/dat
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /opt/render/project/src/dat/schoolzone.db
      - key: BACKUP_DIR
        value: /opt/render/project/src/dat/backups
      - key: BACKUP_KEEP
        value: "14"
      - key: RETENTION_DAYS
        value: "365"
      - key: TRUST_PROXY
        value: "true"
      - key: TUTOR_ENABLED
        value: "false"

      # Set to the final stable HTTPS URL after service creation.
      - key: APP_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # Render generates these once and preserves them for the service.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: EXPORT_SALT
        generateValue: true
